<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Inventario Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 Control de Inventario</span>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Lista de Productos</h2>
            <a href="/agregar" class="btn btn-primary">+ Nuevo Producto</a>
        </div>

        <div class="table-responsive shadow-sm bg-white rounded">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in productos %}
                    <tr>
                        <td><strong>{{ p.nombre }}</strong><br><small class="text-muted">{{ p.descripcion }}</small></td>
                        <td>${{ p.precio }}</td>
                        <td><span class="badge {{ 'bg-success' if p.stock > 5 else 'bg-danger' }}">{{ p.stock }}</span></td>
                        <td class="text-center">
                            <a href="/eliminar/{{ p.id }}" class="btn btn-outline-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
